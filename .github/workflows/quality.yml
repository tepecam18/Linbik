name: Quality checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Linbik.slnx
      - run: dotnet build Linbik.slnx -c Release --no-restore
      - run: dotnet test tests/Linbik.Tests/Linbik.Tests.csproj -c Release --no-build --no-restore

  nuxt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/nuxt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/nuxt/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Android/Linbik.PasetoAuthManager.Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash gradlew :linbikauth:testDebugUnitTest :linbikauth:assembleDebug :sample:assembleDebug --console=plain
